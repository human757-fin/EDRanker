{% extends "base.html" %}
{% block title %}Flavors{% endblock %}
{% block main %}
<section class="page">
    <div class="page-header">
        <h1>Flavors</h1>
        <p>Explore energy drinks by flavor profile.</p>
    </div>
    <div class="list-grid">
        {% for flavor in flavors %}
            <a class="list-card tile" href="/flavor/{{ flavor.id }}">
                <span class="tile-title">{{ flavor.name }}</span>
                <span class="tile-action">See drinks</span>
            </a>
        {% endfor %}
    </div>
</section>
{% endblock %}
